[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isolated-devsecops-sandbox"
version = "0.1.0"
description = "Ephemeral, locked-down Docker sandboxes for safely benchmarking AI agents that execute code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["docker>=7.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sandbox-bench = "orchestrator.cli:main"

[tool.setuptools]
packages = ["sandbox", "orchestrator"]

[tool.setuptools.package-data]
sandbox = ["seccomp.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the sandbox-runner image"]
addopts = "-ra"
