name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Seccomp profile is in sync with its generator
        run: python scripts/generate_seccomp.py --check
      - run: python -m pytest tests/unit

  sandbox:
    name: Real-Docker sandbox checks
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build the runner image
        run: make image
      - name: Escape-attempt battery
        run: make probe
      - name: Integration tests
        run: python -m pytest tests/integration -m docker
      - name: Benchmark demo agents
        run: make demo
      - name: Adversarial agents
        run: make demo-hostile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: results/
          retention-days: 14
      - name: Remove any leaked sandbox containers
        if: always()
        run: make cleanup
